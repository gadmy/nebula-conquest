# VERIFICATIONS AUTOMATIQUES : a chaque envoi et a chaque demande de fusion,
# GitHub verifie que le jeu est bien fabrique, que le code se lit, que la
# base se recree, et qu'une partie se joue (solo et reseau a deux, avec
# reprise). Une croix rouge = quelque chose a corriger avant de publier.
# Sur main, si tout est vert, le site est ensuite publie (job « publier »).
name: Verifications

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  code:
    name: Fabrication et code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run verifier

  base:
    name: Base de donnees (migrations Supabase)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: essai
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: essai
    steps:
      - uses: actions/checkout@v4
      - run: sh supabase/tests/rejouer.sh

  jeu:
    name: Parties de jeu (multijoueur identique, solo, reseau)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Multijoueur identique (banc lockstep)
        run: node outils/lockstep-test.mjs --tours 12000
      - name: Partie solo
        run: node tests/partie-solo.mjs
      - name: Partie en reseau a deux, avec reprise
        run: node tests/reseau.mjs

  # PUBLICATION PROTEGEE : le site n'est mis a jour que sur main, et
  # seulement si les trois verifications ci-dessus sont vertes.
  # (Reglage GitHub : Settings > Pages > Source = GitHub Actions.)
  publier:
    name: Publication du site
    needs: [code, base, jeu]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    concurrency:
      group: publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploiement
        uses: actions/deploy-pages@v4
